<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande reçue — R&C Pilotage</title>
<meta name="description" content="Votre demande a bien été transmise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --noir:#0A0A0A;
  --blanc:#F1F0EB;
  --acier:#9A9FA4;
  --acier-2:#70747A;
  --encre-2:#54544E;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{height:100%}
body{
  background:var(--noir);color:var(--blanc);font-family:var(--sans);
  font-weight:400;font-size:1rem;line-height:1.65;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem 1.5rem;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility
}
::selection{background:var(--blanc);color:var(--noir)}

.wrap{max-width:560px;text-align:center}

.check-circle{
  width:80px;height:80px;margin:0 auto 2rem;
  border:2px solid var(--acier);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;opacity:0;animation:checkFade .8s ease-out .3s forwards
}
@keyframes checkFade{to{opacity:1}}
.check-circle::after{
  content:'';position:absolute;
  width:24px;height:12px;
  border:2px solid var(--acier);border-top:none;border-right:none;
  transform:rotate(-45deg);
}

.kicker{
  font-size:.66rem;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--acier-2);
  margin-bottom:1.2rem;opacity:0;animation:kickerFade .6s ease-out .5s forwards
}
@keyframes kickerFade{to{opacity:1}}

h1{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(2.2rem,4vw,3.2rem);line-height:1.1;
  letter-spacing:-.01em;margin-bottom:.6rem;
  opacity:0;animation:titleFade .7s ease-out .7s forwards
}
@keyframes titleFade{to{opacity:1}}

h1 em{font-style:italic;font-weight:500}

.lead{
  font-size:1.02rem;color:var(--encre-2);line-height:1.7;
  max-width:52ch;margin:2rem auto 1.8rem;
  opacity:0;animation:leadFade .7s ease-out .9s forwards
}
@keyframes leadFade{to{opacity:1}}

.note{
  font-size:.92rem;color:var(--acier);line-height:1.65;
  background:rgba(241,240,235,.04);border:1px solid rgba(241,240,235,.08);
  padding:1.2rem 1.4rem;margin:2rem 0;border-radius:0;
  opacity:0;animation:noteFade .7s ease-out 1.1s forwards
}
@keyframes noteFade{to{opacity:1}}

.delay{
  display:flex;align-items:center;justify-content:center;gap:1rem;
  padding:1.4rem 1.6rem;background:rgba(241,240,235,.03);
  border:1px solid rgba(241,240,235,.08);margin:2rem 0;border-radius:0;
  opacity:0;animation:delayFade .7s ease-out 1.3s forwards
}
@keyframes delayFade{to{opacity:1}}

.delay-time{
  font-family:var(--serif);font-weight:500;font-size:1.8rem;
  color:var(--blanc);line-height:1
}
.delay-label{font-size:.72rem;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--acier-2)
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
  background:var(--blanc);color:var(--noir);
  padding:1rem 2rem;font-family:var(--sans);font-size:.74rem;
  font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;border:none;cursor:pointer;
  margin-top:2.6rem;transition:transform .3s,background .3s;
  opacity:0;animation:btnFade .7s ease-out 1.5s forwards
}
@keyframes btnFade{to{opacity:1}}
.btn:hover{background:#f5f5f1;transform:translateY(-2px)}
.btn svg{width:12px;height:auto;transition:transform .3s}
.btn:hover svg{transform:translateX(3px)}

.footer{
  font-size:.68rem;color:var(--acier-2);margin-top:3rem;
  opacity:0;animation:footerFade .6s ease-out 1.7s forwards
}
@keyframes footerFade{to{opacity:1}}
.footer a{color:var(--acier-2);text-decoration:none;transition:color .3s}
.footer a:hover{color:var(--blanc)}

@media (max-width:640px){
  body{padding:1.5rem 1rem}
  .check-circle{width:64px;height:64px;margin-bottom:1.6rem}
  h1{font-size:clamp(1.8rem,3.5vw,2.6rem);margin-bottom:.5rem}
  .lead{margin:1.5rem auto 1.4rem}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="check-circle"></div>
  <p class="kicker">Demande reçue</p>
  <h1>Votre demande a bien<br><em>été transmise.</em></h1>
  <p class="lead">Je reviens vers vous dans les meilleurs délais pour un premier échange.</p>
  
  <div class="note">
    <p><strong>Pas de réponse automatique</strong> — un retour direct et personnalisé.</p>
  </div>
  
  <div class="delay">
    <div>
      <div class="delay-time">48h</div>
      <div class="delay-label">Délai de<br>réponse<br>habituel</div>
    </div>
  </div>

  <a href="https://rcpilotage.fr" class="btn">Retourner au site
    <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M9 1l4 4-4 4M13 5H1" stroke="currentColor" stroke-width="1.4"/></svg>
  </a>

  <p class="footer">
    <a href="https://rcpilotage.fr">R&amp;C Pilotage</a> · Conseil opérationnel CHR
  </p>
</div>

</body>
</html>
